name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (real turn against the fake model)
        run: pnpm test

      - name: Install Chromium
        run: node node_modules/playwright-core/cli.js install --with-deps chromium

      - name: End-to-end
        run: pnpm e2e
        env:
          MOONAN_SCREENSHOTS: /tmp/moonan-e2e-shots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/moonan-e2e-shots
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Check the published entry points exist
        run: |
          test -f packages/contracts/dist/index.js
          test -f packages/web-api/dist/index.js
          test -f packages/core/dist/index.js
          test -f packages/testing/dist/index.js
          for plugin in agents providers chat mcp logs; do
            test -f "packages/plugin-$plugin/dist/server.js"
            test -f "packages/plugin-$plugin/dist/contract.js"
            test -f "packages/plugin-$plugin/dist/web.js"
          done
          test -f packages/moonan/dist/index.js
          test -f packages/moonan/dist/web/index.html
          # The shell and its import map must ship together: a plugin loaded at runtime
          # imports /runtime/*.js, so a build without them is broken at first click.
          for runtime in react jsx-runtime react-dom chord chord-output typebox typebox-value contracts web-api; do
            test -f "packages/web/dist/runtime/$runtime.js"
          done
          grep -q 'type="importmap"' packages/web/dist/index.html
