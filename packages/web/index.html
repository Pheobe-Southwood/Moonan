<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<title>Moonan</title>
		<!--
			The shared runtime for plugins loaded at runtime. Every plugin bundle imports these
			bare specifiers, and this map is what makes one React instance (and one Chord
			instance) serve the shell and every plugin. Built by scripts/build-runtime.mjs.
		-->
		<script type="importmap">
			{
				"imports": {
					"react": "/runtime/react.js",
					"react/jsx-runtime": "/runtime/jsx-runtime.js",
					"react-dom": "/runtime/react-dom.js",
					"react-dom/client": "/runtime/react-dom.js",
					"@earendil-works/chord": "/runtime/chord.js",
					"@earendil-works/chord/context": "/runtime/chord-context.js",
					"@earendil-works/chord/delta": "/runtime/chord-delta.js",
					"@earendil-works/chord/output": "/runtime/chord-output.js",
					"typebox": "/runtime/typebox.js",
					"typebox/value": "/runtime/typebox-value.js",
					"@moonan_ai/sdk": "/runtime/sdk.js",
					"@moonan_ai/sdk/web": "/runtime/sdk-web.js"
				}
			}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
